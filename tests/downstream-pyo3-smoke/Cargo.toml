[package]
name = "qtty-pyo3-downstream-smoke"
version = "0.0.0"
edition = "2021"
publish = false

# Keep this fixture independent from the repository workspace so Cargo resolves
# it like an external downstream consumer.
[workspace]
resolver = "2"

[dependencies]
pyo3 = "0.29"
qtty-ffi = { path = "../../qtty-ffi", features = ["pyo3"] }
